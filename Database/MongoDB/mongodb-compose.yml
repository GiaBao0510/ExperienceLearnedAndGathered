version: '3.8'

services:   #service thì có thể có nhiều container

  mongo:
    image: mongo          #Ví dụ sử dụng phiên bản theo yêu cầu: mongo:windowsservercore-ltsc2022
    restart: always       #Nếu container bị lỗi thì sẽ luôn tự động restart lại
    container_name: mongodb-container   #Tự đặt tên
    posts:              #Ánh xạ cổng từ bên host sang container
      - 27018:27017
    volumes:            #Cho biết database hiện tại của bạn đang chứa ở đâu
      - './mongodb:/data/db'  #Ánh xạ dữ liệu từ mongodb sang /data/db .Khi có sự cố
    environment:        #Các biến môi trường
      MONGO_INITDB_ROOT_USERNAME: root            #Tài khoản
      MONGO_INITDB_ROOT_PASSWORD: giabao2002      #Mật khẩu

  mongo-express:
    image: mongo-express
    restart: always
    container_name: mongodb-express-container
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: giabao2002
      ME_CONFIG_MONGODB_URL: mongodb://root:giabao2002@mongo:27017/