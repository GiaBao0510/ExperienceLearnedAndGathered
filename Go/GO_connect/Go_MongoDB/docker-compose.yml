version: '3.8'  # Phiên bản của docker-compose

# Định nghĩa cấu hình Logging dùng chung cho tất cả các service
# Giải thích:
#   driver: "json-file"  → Docker lưu log dạng JSON (mặc định)
#   max-size: "10m"      → Mỗi file log tối đa 10MB
#   max-file: "3"        → Giữ tối đa 3 file xoay vòng → tổng tối đa 30MB/service
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:latest  # Sử dụng image MongoDB mới nhất
    container_name: mongodb  # Đặt tên container là mongodb
    restart: always  # Tự động restart khi container bị dừng
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin  # Tài khoản root của MongoDB
      - MONGO_INITDB_ROOT_PASSWORD=admin123  # Mật khẩu root
    ports:
      - "27017:27017"  # Map cổng 27017 từ máy host vào container
    volumes:
      - mongo_data:/data/db  # Lưu dữ liệu MongoDB ra volume để không bị mất khi container xóa
    logging: *default-logging

  mongo-express:
    image: mongo-express  # Image giao diện web quản lý MongoDB
    container_name: mongo-express  # Tên container
    restart: always  # Tự động restart
    depends_on:
      - mongodb  # Đảm bảo MongoDB khởi động trước mongo-express
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://admin:admin123@mongodb:27017/?authSource=admin
      - ME_CONFIG_MONGODB_SERVER=mongodb             # Trỏ tới tên service mongodb (quan trọng!)
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin        # Username để đăng nhập MongoDB
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin123     # Password tương ứng
      - ME_CONFIG_BASICAUTH_USERNAME=admin           # Username đăng nhập giao diện web
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123        # Password đăng nhập giao diện web
    ports:
      - "8081:8081"  # Truy cập giao diện web tại localhost:8081
    logging: *default-logging

volumes:
  mongo_data:  # Khai báo volume để lưu trữ dữ liệu MongoDB