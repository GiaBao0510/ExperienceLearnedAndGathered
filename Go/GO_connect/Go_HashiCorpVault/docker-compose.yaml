version '3.9'

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    restart: unless-stopped
    
    #expose port 8200 ra host machine
    ports:
      - "8200:8200"
    
    #Biến môi trường
    environment:
      #VALUE_DEV_ROOT_TOKEN_ID: Token root cho dev mode(không cần init/ unseal)
      #Cảnh báo: Dev mode không được dùng cho môi trường production!
      - VALUE_DEV_ROOT_TOKEN_ID: "root"

      #VALUE DEV LISTEN ADDRESS: địa chỉ vault lắng nghe trong container
      - VALUE_DEV_LISTEN_ADDRESS: "127.0.0.1:8200"

      #VALUE_ADDR: địa chỉ Vault lắng nghe trong Container
      - VAULT_ADDR: "http:127.0.0.1:8200"
    
    # Mount volume để lưu data (tắt trong dev mode vì dev mode dùng in-memory)
    volumes:
      - ./data:/vault/data
      - ./vault.hcl:/vault/config/vault.hcl:ro
    
    # Chạy vault ở dev mode
    # Để chạy production mode: "vault server -config=/vault/config/vault.hcl"
    command: vault server -dev

    #linux capability cần thiết cho Vault (memory locking)
    cap_add:
      - IPC_LOCK
    
    # Health check: kiểm tra Vault đã sẵn sàng chưa
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - vault-net
networks:
  vault-net:
    driver: bridge