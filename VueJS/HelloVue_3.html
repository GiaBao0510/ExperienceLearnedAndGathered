<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Comatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         
        <!--Có thể hướng dẫn trình duyệt nơi xác định nhập vue bởi ImportMap-->
        <script type="importmap">
            {
                "imports":{
                    "vue": "https://unpkg.com/vue@3.4.15/dist/vue.esm-browser.js"
                }
            }
        </script>
    </head>
    <body>
        
        <div id="app">{{ message }}</div>

        <!--Sử dụng Vue từ CDN thông qua các module ES gốc-->
        <script type="module">
            import {createApp} from "vue";   //Kết nối trực tiếp cách 2

            //createApp: Tạo ra 1 phiên bản ứng dụng chứa các thành ứng dụng
            const app = createApp({
                data(){
                    return{
                        message: "Hello world!"
                    }
                }
            });

            app.mount('#app');
            //Phương thức này .mount()phải luôn được gọi sau khi hoàn tất tất cả cấu hình ứng dụng và đăng ký nội dung
        </script>
    </body>
</html>
