<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Vue.js</title>
    <script src="https://unpkg.com/vue@3"></script>
    <style>
        .mauChu{
            color: blueviolet;
        }
    </style>
</head>
<body> 
    <h2 id="app">
        <span v-bind:class="ClassName" style="text-align: center;" v-html="slogan"></span>
    </h2>
    
    <script>
        const app = Vue.createApp({
            data(){
                return{
                    slogan: "Code thôi AE",
                    ClassName:"mauChu",
                };
            },
        }).mount('#app');
    </script>
</body>
</html>
