<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DeclarativeRendering</title>
        <script src="https://unpkg.com/vue@3"></script>
    </head>
    <body>
        <div id="app">
            <!--Dấu ngoặc nhọn đổi được sử dụng làm phần giữ chỗ để nội suy dữ liệu cần thiết trong DOM-->
            <button @click="count+=1">
                Count is: {{count}}
            </button>
            <br>
            <button @click="count -= count">
                Delete
            </button>
        </div>

        <script>
            const app = Vue.createApp({
                data(){
                    return{
                        count:0    //Gán giá trị ban đâu là 0
                    };
                }
            });
            app.mount('#app');
        </script>
    </body>
</html>
