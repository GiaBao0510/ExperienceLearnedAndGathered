<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Vue.js</title>
    <script src="https://unpkg.com/vue@3"></script>
    <style>
        .mauChu{
            color: blueviolet;
        }
    </style>
</head>
<body> 
    <h2 id="app">
        <input type="button" v-bind:disabled="isShowButton" @click="isShowButton=true" value="Button Disabled">
        <input type="button" v-bind:disabled="!isShowButton" @click="isShowButton=false" value="Button Enabled">
    </h2>
    
    <script>
        const app = Vue.createApp({
            data(){
                return{
                    isShowButton: false
                };
            },
        }).mount('#app');
    </script>
</body>
</html>
