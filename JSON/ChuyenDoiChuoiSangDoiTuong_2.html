<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chuyển đổi chuỗi sang đối tượng trong JS</title>
    </head>
    <body>
        <h1>Create a Object from a JSON string</h1>
        <p id="demo"></p>

        <script>
            const txt = '{"name":"Gia Bảo", "age":22, "height":"178 cm", "weight":"67 kg"}';
            const ob = JSON.parse(txt);
            document.getElementById('demo').innerHTML = ob.name;
        </script>

        <!--Khi sử dụng JSON.parse()trên JSON bắt nguồn từ một mảng, 
            phương thức sẽ trả về một mảng JavaScript, thay vì một đối tượng JavaScript
        -->
        <h2>Dữ liệu được viết dưới dạng mảng JSON sẽ được phân tích thành dạng mảng của JS</h2>
        <p id="demo1"></p>
        <script>
            const txt1 = '["clinet", "patron", "customer"]';
            const ob1 = JSON.parse(txt1);
            document.getElementById('demo1').innerHTML = ob1[1];
        </script>

        <!--Chức năng phân tích cú pháp
            Các hàm không được phép trong JSON.
            Nếu bạn cần bao gồm một hàm, hãy viết nó dưới dạng một chuỗi.
            Bạn có thể chuyển đổi nó trở lại thành một chức năng sau:
        -->
        <h2>Chuyển đổi một chuỗi thành một hàm</h2>
        <p id="demo2"></p>
        <script>
            const txt2 = '{"name":"Gia Bảo", "age":"function() {return 30;}", "height":"178 cm", "weight":"67 kg"}';
            const ob2 = JSON.parse(txt2);
            ob2.age = eval("( "+ob2.age+")");
            document.getElementById('demo2').innerHTML = ob2.age();
        </script>
        
    </body>
</html>
