<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Máy chủ JSON</title>
    </head>
    <body>
        <!--Gửi dữ liệu
            Nếu bạn có dữ liệu được lưu trữ trong một đối tượng JavaScript, 
            bạn có thể chuyển đổi đối tượng đó thành JSON và gửi nó đến máy chủ
        -->
        <h3>Chuyển đổi đối tượng JavaScript thành một chuỗi JSON, và gửi nó đến máy chủ</h3>
        <script>
            let person = {

                age:22,
                city:"tp.Cần Thơ"
            };
            /*let text1 = JSON.stringify(person);
            window.location = "demoJSON.php?x="+ text1;*/
        </script>

        <!--JSON từ máy chủ
            Bạn có thể yêu cầu JSON từ máy chủ bằng cách sử dụng yêu cầu AJAX
            Miễn là phản hồi từ máy chủ được viết ở định dạng JSON, 
            bạn có thể phân tích chuỗi thành đối tượng JavaScript.
        -->
        <h3>Sử dụng XMLHttpRequest để lấy dữ liệu từ máy chủ:</h3>
        <p id="demo"></p>
        <script>
            const xmlhttp = new XMLHttpRequest();
            xmlhttp.onload = function() {
                const myObj = JSON.parse(this.responseText);
                document.getElementById("demo").innerHTML = myObj.name;
            }
            xmlhttp.open("GET", "json_text1.txt");
            xmlhttp.send();
        </script>
    </body>
</html>
