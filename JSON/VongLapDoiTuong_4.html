<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vòng lặp đối tượng</title>
    </head>
    <body>
        <h3>Vòng lặp đối tượng</h3>
        <p id="demo"></p>
        <script>
            let stringOB = '{"name":"Gia Bảo", "money":32, "city":"TP.Cần Thơ"}';
            let ob = JSON.parse(stringOB);
            let text = "";
            for (const i in ob){
                text += i + ":";  //Chỉ thêm với khóa
                text += ob[i]+" ";      //Chỉ thêm với giá trị
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
