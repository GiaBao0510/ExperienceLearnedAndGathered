<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đối tượng trong Javascript</title>
    </head>
    <body>
        <h1>Access a Javascript object</h1>
        <p id="name"></p>
        <p id="age"></p>

        <script async>
            const person = {name:"Gia Bảo", age:22, height:"178 cm", weight:"67 kg"};
            document.getElementById("name").innerHTML = person.name;
            document.getElementById("age").innerHTML = person['age'];
        </script>
    </body>
</html>
