syntax = "proto3";

package product;

option go_package = "./";

enum Category{
   TYPE_OF_TECHNOLOGY = 0; // Loại công nghệ
   TYPE_OF_FASHION = 1; // Loại thời trang
    TYPE_OF_FOOD = 2; // Loại thực phẩm
}

message Product {
    int32 id = 1;
    string name = 2;
    float price = 3;
    bool in_stock = 4;
    Category category = 5;
}

// ĐỊnh nghĩa các hàm RPC mà server cung cấp 
service ProductService {
    
    // Lấy thông tin sản phầm theo ID
    rpc GetProductByID (GetProductByIDRequest) returns (Product);

    // lấy thông tin sản phầm theo loại
    rpc GetProductByCategory (GetProductByCategoryRequest) returns (stream Product);

    // Lấy danh sách sản phẩm
    rpc ListProducts (GetListProductsRequest)  returns (stream Product);

    // Tạo sản phẩm mới
    rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
}

message GetProductByIDRequest {int32 id = 1;} // Request để lấy thông tin sản phẩm theo ID
message GetProductByCategoryRequest {Category category = 1;} // Request để lấy thông tin sản phẩm theo loại
message GetListProductsRequest {int32 page = 1; int32 page_size = 2;} // Request để lấy danh sách sản phẩm theo trang và kích thước trang
message CreateProductRequest {string name = 1; float price = 2; bool in_stock = 3; Category category = 4;} // Request để tạo sản phẩm mới với tên, giá, tình trạng kho và loại
message CreateProductResponse {int32 id = 1;} // Response trả về ID của sản phẩm mới được tạo