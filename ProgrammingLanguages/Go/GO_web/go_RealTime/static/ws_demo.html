<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Demo — Mini Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { color: #a78bfa; margin-bottom: 0.25rem; }
    .subtitle { color: #64748b; margin-bottom: 1.5rem; font-size: 0.875rem; }

    /* ── Login Screen ── */
    #login-screen {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    #login-screen h2 { color: #a78bfa; margin-bottom: 1rem; }
    #login-screen input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    #login-screen input:focus { border-color: #a78bfa; }

    /* ── Chat Screen ── */
    #chat-screen { display: none; width: 100%; max-width: 700px; }

    .chat-header {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px 12px 0 0;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header .room-name { font-weight: 600; color: #a78bfa; }
    .status-bar { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .dot.connected { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    #messages {
      background: #1a2332;
      border-left: 1px solid #334155;
      border-right: 1px solid #334155;
      height: 420px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .msg { display: flex; flex-direction: column; max-width: 75%; }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }
    .msg.system { align-self: center; align-items: center; max-width: 100%; }

    .msg-sender { font-size: 0.7rem; color: #64748b; margin-bottom: 2px; }
    .msg-bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.mine .msg-bubble { background: #7c3aed; color: #fff; border-radius: 12px 12px 2px 12px; }
    .msg.theirs .msg-bubble { background: #1e293b; color: #e2e8f0; border-radius: 12px 12px 12px 2px; border: 1px solid #334155; }
    .msg.system .msg-bubble { background: transparent; color: #475569; font-size: 0.78rem; font-style: italic; }
    .msg-time { font-size: 0.65rem; color: #475569; margin-top: 2px; }

    .chat-input-area {
      background: #1e293b;
      border: 1px solid #334155;
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 0.75rem;
      display: flex;
      gap: 0.5rem;
    }
    #msg-input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
    }
    #msg-input:focus { border-color: #a78bfa; }
    #msg-input:disabled { opacity: 0.4; }

    button {
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #475569;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>
  <h1>💬 WebSocket Mini Chat</h1>
  <p class="subtitle">Demo giao tiếp 2 chiều: Client ↔ Server qua WebSocket</p>

  <!-- ── Màn hình đăng nhập ── -->
  <div id="login-screen">
    <h2>Nhập tên của bạn</h2>
    <input type="text" id="username-input" placeholder="VD: GiaBao" maxlength="20"
           onkeydown="if(event.key==='Enter') joinChat()">
    <button class="btn-primary" style="width:100%" onclick="joinChat()">
      🚀 Vào phòng chat
    </button>
  </div>

  <!-- ── Màn hình chat ── -->
  <div id="chat-screen">
    <div class="chat-header">
      <div>
        <div class="room-name">💬 Phòng chat chung</div>
        <div class="info-bar">
          <span id="my-name-display"></span>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;align-items:center">
        <div class="status-bar">
          <div class="dot" id="dot"></div>
          <span id="status-text">Đang kết nối...</span>
        </div>
        <button class="btn-danger" onclick="leaveChat()" style="padding:0.4rem 0.9rem;font-size:0.8rem">
          Thoát
        </button>
      </div>
    </div>

    <div id="messages">
      <!-- Messages hiện ra ở đây -->
    </div>

    <div class="chat-input-area">
      <input type="text" id="msg-input" placeholder="Nhập tin nhắn... (Enter để gửi)"
             disabled maxlength="500"
             onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="btn-primary" id="send-btn" onclick="sendMessage()" disabled>
        Gửi ➤
      </button>
    </div>
  </div>

  <script>
    let ws = null;
    let myUsername = '';

    // ── Bước 1: Vào phòng chat ──
    function joinChat() {
      const input = document.getElementById('username-input');
      const name = input.value.trim();
      if (!name) {
        input.focus();
        input.style.borderColor = '#ef4444';
        return;
      }

      myUsername = name;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'block';
      document.getElementById('my-name-display').textContent = `Bạn đang chat với tên: ${name}`;

      connectWebSocket(name);
    }

    // ── Bước 2: Kết nối WebSocket ──
    function connectWebSocket(username) {
      // Tạo URL WebSocket với username trong query string
      const wsUrl = `ws://${location.host}/ws?username=${encodeURIComponent(username)}`;

      setStatus('', 'Đang kết nối...');

      // Khởi tạo WebSocket — browser tự thực hiện HTTP handshake
      ws = new WebSocket(wsUrl);

      // Sự kiện: kết nối thành công
      ws.onopen = () => {
        setStatus('connected', 'Đã kết nối');
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('msg-input').focus();
      };

      // Sự kiện: nhận message từ server (có thể là từ bất kỳ user nào)
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        renderMessage(msg);
      };

      // Sự kiện: kết nối bị đóng
      ws.onclose = () => {
        setStatus('', 'Đã ngắt kết nối');
        document.getElementById('msg-input').disabled = true;
        document.getElementById('send-btn').disabled = true;
      };

      // Sự kiện: lỗi kết nối
      ws.onerror = (err) => {
        setStatus('error', 'Lỗi kết nối');
        console.error('WebSocket error:', err);
      };
    }

    // ── Bước 3: Gửi message ──
    function sendMessage() {
      const input = document.getElementById('msg-input');
      const content = input.value.trim();

      // Không gửi message rỗng hoặc khi ws chưa sẵn sàng
      if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

      // Gửi JSON lên server — server sẽ broadcast đến mọi người
      ws.send(JSON.stringify({ content }));

      input.value = '';  // Xóa input sau khi gửi
      input.focus();
    }

    // ── Render message lên màn hình ──
    function renderMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';

      if (msg.type === 'system') {
        // Thông báo hệ thống (join/leave)
        div.classList.add('system');
        div.innerHTML = `<div class="msg-bubble">${msg.content}</div>`;

      } else {
        // Tin nhắn chat — phân biệt của mình (mine) hay người khác (theirs)
        const isMine = msg.sender === myUsername;
        div.classList.add(isMine ? 'mine' : 'theirs');

        const time = new Date(msg.timestamp).toLocaleTimeString('vi-VN',
          { hour: '2-digit', minute: '2-digit' });

        div.innerHTML = `
          ${!isMine ? `<div class="msg-sender">${msg.sender}</div>` : ''}
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <div class="msg-time">${time}</div>
        `;
      }

      container.appendChild(div);
      // Cuộn xuống cuối khi có tin mới
      container.scrollTop = container.scrollHeight;
    }

    // ── Thoát phòng chat ──
    function leaveChat() {
      if (ws) {
        ws.close();
        ws = null;
      }
      document.getElementById('chat-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('username-input').value = '';
      document.getElementById('messages').innerHTML = '';
    }

    function setStatus(state, text) {
      const dot = document.getElementById('dot');
      dot.className = 'dot ' + state;
      document.getElementById('status-text').textContent = text;
    }

    // Ngăn XSS khi render message của người khác
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }
  </script>
</body>
</html>
